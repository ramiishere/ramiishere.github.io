<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab của Rami</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1e29;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --vocaloid-cyan: #39c5bb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 4px solid var(--vocaloid-cyan);
        }
        h1 {
            margin-top: 0;
            color: var(--vocaloid-cyan);
            font-size: 2rem;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
        }
        .tag {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 15px;
            font-weight: 600;
        }
        .tiktok-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .tiktok-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lab của Rami</h1>
        <p>Nơi trú ẩn của mã nguồn mở, phần cứng độ chế và sự nổi loạn chống lại bloatware.</p>
        <div>
            <span class="tag">System Status: Online & Unrestricted</span>
        </div>
        <div>
            <a href="https://www.tiktok.com/@rami.lab39" target="_blank" class="tiktok-link">
                🔗 Ghé thăm TikTok của Lab
            </a>
        </div>
    </div>
</body>
</html>
